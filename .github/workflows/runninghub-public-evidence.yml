name: RunningHub public evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'playwright==1.55.0'
      - run: python -m playwright install --with-deps chromium
      - name: Read public rate tables and catalog
        run: python -u scripts/rh_public_price_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runninghub-public-probe-${{ github.sha }}
          path: output/public-probe
          retention-days: 7
          if-no-files-found: error
