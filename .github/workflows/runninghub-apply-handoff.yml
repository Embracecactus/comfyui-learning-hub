name: Apply verified RunningHub repair
on:
  push:
    branches: [fix/runninghub-cost-reconciliation-20260921]
    paths: [.github/workflows/runninghub-apply-handoff.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Embracecactus/comfyui-learning-hub' && github.ref == 'refs/heads/fix/runninghub-cost-reconciliation-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay reviewed source, validate, and commit without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request
          from pathlib import Path, PurePosixPath
          REPO = 'Embracecactus/comfyui-learning-hub'
          BRANCH = 'fix/runninghub-cost-reconciliation-20260921'
          BASE = '53889d7ef6981a1401d701de4d89bddabecd4d85'
          BOOT = '.github/workflows/runninghub-apply-handoff.yml'
          BLOBS = ['402a2a9144e25619e000d9dbb6fd7bb6465c2587', 'a33e066e9a538a57baa7bead6bd7358c0ada659c', 'e33d35744c439990e03b5673f039506114b41ce0']
          EXPECTED = '416c87b9779808eb87a64c10b6a69994e39eca431ab6453a61a30c29bbd3be56'
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + BRANCH
          def run(*args, **kw):
              return subprocess.run(args, check=True, **kw)
          run('git', 'merge-base', '--is-ancestor', BASE, 'HEAD')
          changed = subprocess.check_output(['git','diff','--name-only',BASE,'HEAD']).decode().splitlines()
          assert set(changed) == {BOOT}, 'Concurrent branch edits: refusing to overwrite'
          segments = []
          for sha in BLOBS:
              req = urllib.request.Request('https://api.github.com/repos/' + REPO + '/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'runninghub-repair'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = json.load(response)
              raw = base64.b64decode(body['content'])
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == sha, 'Blob identity mismatch'
              segments.append(raw)
          archive = base64.b64decode(b''.join(segments), validate=True)
          assert hashlib.sha256(archive).hexdigest() == EXPECTED, 'Repair payload checksum mismatch'
          manifest = json.loads(lzma.decompress(archive))
          assert manifest['base_commit'] == BASE
          allowed = {'README.md', '.github/workflows/runninghub-handoff-check.yml',
                     'scripts/rh_survey_build_cost_tables.py', 'scripts/rh_survey_build_registry.py',
                     'scripts/rh_survey_handoff.py', 'scripts/runninghub_h3_t2v.py',
                     'tests/scripts/test_rh_handoff.py'}
          def checked_path(name):
              p = PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name in allowed or name.startswith('docs/05-RunningHub-API/'), 'Out-of-scope path'
              return Path(name)
          entries = manifest['files']
          assert len(entries) == 19 and len(manifest['generated_paths']) == 11
          for entry in entries:
              p = checked_path(entry['path'])
              old = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert old == entry['old_sha256'], 'Stale source: ' + str(p)
          for entry in entries:
              p = checked_path(entry['path'])
              if 'patch' in entry:
                  run('git', 'apply', '-', input=entry['patch'].encode())
              else:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(entry['content'], encoding='utf-8')
              assert hashlib.sha256(p.read_bytes()).hexdigest() == entry['new_sha256'], 'Source checksum mismatch: ' + str(p)
          run('python3', 'scripts/rh_survey_handoff.py')
          run('python3', '-m', 'unittest', 'discover', '-s', 'tests/scripts', '-p', 'test_*.py', '-v')
          run('python3', '-m', 'unittest', 'discover', '-s', 'tests/custom_nodes', '-p', 'test_*.py', '-v')
          run('python3', 'scripts/rh_survey_build_registry.py', '--check')
          run('python3', 'scripts/rh_survey_build_cost_tables.py', '--check')
          for p in Path('docs/05-RunningHub-API/examples/curl').glob('*.sh'):
              run('bash', '-n', str(p))
          run('git', 'diff', '--check')
          # Workflow edits are finalized separately through the authorized connector.
          # This short-lived job only commits the reviewed application/docs paths.
          paths = [e['path'] for e in entries if not e['path'].startswith('.github/')]
          paths += manifest['generated_paths']
          for name in paths:
              checked_path(name)
          run('git', 'add', '--', *paths)
          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          run('git', 'commit', '-m', 'fix: reconcile RunningHub 2K pricing, evidence and safe client handoff')
          run('git', 'push', 'origin', 'HEAD:refs/heads/' + BRANCH)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Verified repair applied\n102 script tests + 20 custom-node tests passed. Both generated-file checks and five shell syntax checks passed. No RunningHub credentials or paid tasks were used.\n')
          PY
