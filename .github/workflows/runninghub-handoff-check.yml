name: RunningHub handoff validation
on:
  push:
    branches: [main, fix/runninghub-cost-reconciliation-20260921]
    paths:
      - 'docs/05-RunningHub-API/**'
      - 'scripts/rh_survey_*.py'
      - 'scripts/runninghub_h3_t2v.py'
      - 'tests/scripts/test_rh_handoff*.py'
      - 'tests/scripts/test_rh_public*.py'
      - '.github/workflows/runninghub-handoff-check.yml'
  pull_request:
    paths:
      - 'docs/05-RunningHub-API/**'
      - 'scripts/rh_survey_*.py'
      - 'scripts/runninghub_h3_t2v.py'
      - 'tests/scripts/test_rh_handoff*.py'
      - 'tests/scripts/test_rh_public*.py'
      - '.github/workflows/runninghub-handoff-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression checks
        run: |
          python3 -m unittest discover -s tests/scripts -p 'test_*.py' -v
          python3 -m unittest discover -s tests/custom_nodes -p 'test_*.py' -v
          python3 scripts/rh_survey_build_registry.py --check
          python3 scripts/rh_survey_build_cost_tables.py --check
          for f in docs/05-RunningHub-API/examples/curl/*.sh; do bash -n "$f"; done
      - name: Publish exact verified source archive
        run: git archive --format=zip --output="$RUNNER_TEMP/runninghub-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: runninghub-source-${{ github.sha }}
          path: ${{ runner.temp }}/runninghub-source.zip
          retention-days: 7
          if-no-files-found: error
