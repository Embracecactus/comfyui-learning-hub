name: Windows curl preflight regression
on:
  push:
    branches:
      - test/windows-curl-preflight-20260922
    paths:
      - .github/workflows/windows-curl-regression.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover exact test files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @()
          $shas = @('1e52f80fe158ff16aab08c8a2189412f9c5ae81c','29973cc6a9cc2d1736cdeff5310f804ab9fd5f39','0d35d196a461058618ffb7a88337b7943abf29bb')
          foreach ($sha in $shas) {
            $url = 'https://api.github.com/repos/Embracecactus/comfyui-learning-hub/git/blobs/' + $sha
            $obj = Invoke-RestMethod -Uri $url -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json'}
            $parts += [Text.Encoding]::ASCII.GetString([Convert]::FromBase64String($obj.content))
          }
          $bytes = [Convert]::FromBase64String(($parts -join ''))
          $hash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes))).Replace('-','').ToLowerInvariant()
          if ($hash -ne '701c3ea0903e9e44634d2feebc2add98e976429d235c8a1983f827c5fa0533d3') { throw 'Test source hash mismatch' }
          $zip = Join-Path $env:RUNNER_TEMP 'rh-test.zip'
          [IO.File]::WriteAllBytes($zip,$bytes)
          $dir = Join-Path $env:RUNNER_TEMP 'RH windows test'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $followup = Invoke-RestMethod -Uri 'https://api.github.com/repos/Embracecactus/comfyui-learning-hub/git/blobs/deb0f3a5d407c2b75e19f8f3e620166f284c58ac' -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json'}
          $patchPath = Join-Path $env:RUNNER_TEMP 'rh-followup.py'
          [IO.File]::WriteAllBytes($patchPath,[Convert]::FromBase64String($followup.content))
          python $patchPath $dir
          if ($LASTEXITCODE -ne 0) { throw 'Verified followup failed' }
          $expected = @{'rh-curl.ps1'='9ab8d44a000dd2f6a18e587dcd655ea5c9da9b50a717cd1559c2e435f7e7ffc4';'99-Check-Offline.ps1'='e24dfcf43852db05f9251eed2e45871cafff3a73b86021a6253893a23a29cabd';'Set-RHKey.ps1'='00928133351f7a75d14224d4d794d39b6e25f349cf4ae9a3611770dc269b1ef2'}
          foreach ($name in $expected.Keys) {
            if ((Get-FileHash -LiteralPath (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$name]) { throw ('Final source hash mismatch: '+$name) }
          }
          $expected | ConvertTo-Json | Set-Content (Join-Path $dir 'source-sha256.json') -Encoding utf8
          $run = @'
          $ErrorActionPreference='Stop'
          $dir=$PSScriptRoot
          $portFile=Join-Path $dir 'port.txt'
          Remove-Item -LiteralPath $portFile -Force -ErrorAction SilentlyContinue
          $server=Join-Path $dir 'loopback_server.py'
          $python=(Get-Command python -CommandType Application | Select-Object -First 1).Source
          $proc=Start-Process -FilePath $python -ArgumentList @(('"'+$server+'"'),('"'+$portFile+'"')) -PassThru -WindowStyle Hidden
          try {
            for ($i=0;$i -lt 60;$i++) {
              if (Test-Path -LiteralPath $portFile) { break }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path -LiteralPath $portFile)) { throw 'loopback server not ready' }
            $env:RH_CURL_LOOPBACK_ORIGIN='http://127.0.0.1:'+[IO.File]::ReadAllText($portFile).Trim()
            $env:RH_TEST_RESULT_PATH=Join-Path $dir ('test-result-'+$PSVersionTable.PSVersion.Major+'.json')
            & (Join-Path $dir '99-Check-Offline.ps1')
            if (-not (Test-Path -LiteralPath $env:RH_TEST_RESULT_PATH)) { throw 'Test did not reach completion' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          '@
          [IO.File]::WriteAllText((Join-Path $dir 'run-test.ps1'),$run,[Text.UTF8Encoding]::new($true))
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & (Join-Path $env:RUNNER_TEMP 'RH windows test/run-test.ps1')
      - name: Test PowerShell 7
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & (Join-Path $env:RUNNER_TEMP 'RH windows test/run-test.ps1')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-curl-regression
          path: |
            ${{ runner.temp }}/RH windows test/*.ps1
            ${{ runner.temp }}/RH windows test/source-sha256.json
            ${{ runner.temp }}/RH windows test/test-result-*.json
          retention-days: 7
          if-no-files-found: error
